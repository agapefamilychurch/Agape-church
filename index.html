<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>아가페 패밀리 크리스챤 교회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#07111F;color:#FAF6EE;min-height:100vh;}
.shell{max-width:430px;margin:0 auto;min-height:100vh;background:#07111F;display:flex;flex-direction:column;}
.hdr{background:#0D1E35;padding:14px 16px 0;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(201,168,76,.18);}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.brand{font-size:12px;font-weight:700;color:#C9A84C;}
.brand-sub{font-size:9px;color:rgba(201,168,76,.6);margin-top:1px;}
.lang-toggle{display:flex;background:rgba(255,255,255,.06);border-radius:20px;overflow:hidden;border:1px solid rgba(201,168,76,.18);}
.lang-btn{padding:5px 11px;border:none;background:none;font-size:11px;cursor:pointer;font-family:inherit;color:#7A8899;}
.lang-btn.on{background:#C9A84C;color:#07111F;font-weight:700;}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:8px 11px;background:none;border:none;border-bottom:2px solid transparent;color:#7A8899;font-size:10px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab.on{color:#C9A84C;border-bottom-color:#C9A84C;}
.body{flex:1;overflow-y:auto;padding-bottom:24px;}
.hero{background:linear-gradient(160deg,#132844 0%,#152e52 55%,#0b2040 100%);padding:24px 16px 22px;}
.hero-eye{font-size:10px;color:#C9A84C;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.hero-ttl{font-size:24px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:5px;}
.hero-verse{font-size:11px;color:rgba(250,246,238,.6);font-style:italic;line-height:1.6;margin-bottom:18px;border-left:2px solid rgba(201,168,76,.35);padding-left:10px;}
.hero-btns{display:flex;gap:10px;}
.btn-g{background:linear-gradient(135deg,#C9A84C,#8C6E28);color:#07111F;border:none;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-o{background:transparent;color:#C9A84C;border:1.5px solid #C9A84C;padding:11px 18px;border-radius:24px;font-size:13px;cursor:pointer;font-family:inherit;}
.sec{padding:18px 16px 0;}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sec-ttl{font-size:17px;font-weight:700;color:#FAF6EE;}
.see-all{font-size:11px;color:#C9A84C;cursor:pointer;background:none;border:none;font-family:inherit;}
.card{background:#0D1E35;border:1px solid rgba(201,168,76,.18);border-radius:16px;padding:16px;margin-bottom:12px;}
.card-ttl{font-size:15px;font-weight:700;color:#C9A84C;margin-bottom:10px;}
.ecard{background:#0D1E35;border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:13px;display:flex;gap:12px;margin-bottom:10px;}
.ebox{min-width:42px;background:linear-gradient(135deg,#C9A84C,#8C6E28);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 4px;flex-shrink:0;}
.emon{font-size:8px;font-weight:700;color:#07111F;letter-spacing:1px;}
.eday{font-size:20px;font-weight:700;color:#07111F;line-height:1;}
.etag{font-size:9px;color:#D4845A;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.ettl{font-size:13px;font-weight:600;color:#fff;margin-bottom:3px;}
.emeta{font-size:11px;color:#7A8899;}
.mcard{background:#0D1E35;border:1px solid rgba(201,168,76,.18);border-radius:16px;padding:15px;margin-bottom:12px;position:relative;overflow:hidden;}
.mcard::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(#C9A84C,#D4845A);}
.mloc{font-size:10px;color:#C9A84C;letter-spacing:1.5px;text-transform:uppercase;}
.mname{font-size:15px;font-weight:700;color:#fff;}
.mdesc{font-size:11px;color:#7A8899;line-height:1.5;margin:6px 0 10px;}
.pbar-row{display:flex;justify-content:space-between;font-size:11px;color:#7A8899;margin-bottom:4px;}
.pbar-amt{color:#C9A84C;font-weight:700;}
.pbar{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-bottom:10px;}
.pbar-fill{height:100%;background:linear-gradient(90deg,#C9A84C,#D4845A);border-radius:3px;}
.mcard-foot{display:flex;justify-content:space-between;align-items:center;}
.btn-sm{background:rgba(201,168,76,.12);color:#C9A84C;border:1px solid rgba(201,168,76,.4);padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.alb{background:#0D1E35;border-radius:14px;overflow:hidden;border:1px solid rgba(201,168,76,.18);cursor:pointer;}
.alb img,.alb video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
.alb-info{padding:9px 10px 11px;}
.alb-ttl{font-size:12px;font-weight:600;color:#FAF6EE;margin-bottom:2px;}
.alb-meta{font-size:10px;color:#7A8899;}
.notice-card{background:#0D1E35;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:15px;margin-bottom:10px;}
.notice-date{font-size:10px;color:#7A8899;margin-bottom:4px;}
.notice-ttl{font-size:14px;font-weight:600;color:#FAF6EE;margin-bottom:5px;}
.notice-body{font-size:12px;color:rgba(250,246,238,.65);line-height:1.65;}
.add-btn{display:block;width:100%;padding:13px;background:rgba(201,168,76,.1);border:1.5px dashed rgba(201,168,76,.4);border-radius:14px;color:#C9A84C;font-size:13px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit;margin-bottom:14px;}
.upload-area{border:2px dashed rgba(201,168,76,.3);border-radius:14px;padding:20px;text-align:center;cursor:pointer;background:rgba(201,168,76,.04);margin-bottom:14px;}
.bank-box{background:rgba(201,168,76,.07);border:1.5px solid rgba(201,168,76,.3);border-radius:12px;padding:16px 14px;margin-bottom:12px;}
.kakao-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:#FEE500;border:none;border-radius:14px;color:#3A1D1D;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px;}
.worship-cell{background:rgba(201,168,76,.06);border-radius:8px;padding:8px 4px;text-align:center;}
.fin-cell{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.05);}
.staff-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.contact-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.c-icon{width:34px;height:34px;background:rgba(201,168,76,.1);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.tag{font-size:9px;border-radius:10px;padding:1px 7px;font-weight:700;}
.tg{background:rgba(201,168,76,.18);color:#C9A84C;border:1px solid rgba(201,168,76,.35);}
.ta{background:rgba(212,132,90,.2);color:#D4845A;border:1px solid rgba(212,132,90,.4);}
.edit-btn{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);color:#C9A84C;border-radius:8px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:inherit;}
.del-btn{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.3);color:#e07060;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;}
.inp{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(201,168,76,.3);border-radius:10px;padding:12px 14px;color:#FAF6EE;font-size:15px;font-family:inherit;margin-bottom:12px;outline:none;}
.inp:focus{border-color:#C9A84C;}
.inp-sm{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(201,168,76,.3);border-radius:8px;padding:10px;color:#FAF6EE;font-size:14px;font-family:inherit;outline:none;}
.inp-sm:focus{border-color:#C9A84C;}
.lbl{font-size:11px;color:#C9A84C;margin-bottom:4px;display:block;font-weight:600;}
.btn-save{width:100%;padding:14px;background:linear-gradient(135deg,#C9A84C,#8C6E28);border:none;border-radius:14px;color:#07111F;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;}
.btn-cancel{padding:10px 18px;background:rgba(255,255,255,.06);border:none;border-radius:10px;color:#7A8899;font-size:13px;cursor:pointer;font-family:inherit;}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#2A6E49;color:#fff;padding:11px 22px;border-radius:22px;font-size:13px;font-weight:600;z-index:400;font-family:inherit;white-space:nowrap;display:none;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-ov.on{display:flex;}
.modal-box{background:#0D1E35;border-radius:22px 22px 0 0;padding:20px 18px 40px;width:100%;max-width:430px;border-top:1px solid rgba(201,168,76,.3);max-height:88vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:0 auto 16px;}
.modal-ttl{font-size:20px;font-weight:700;color:#FAF6EE;margin-bottom:4px;}
.modal-sub{font-size:12px;color:#7A8899;margin-bottom:16px;}
.amt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.amt-btn{padding:11px 6px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.09);border-radius:12px;color:#FAF6EE;font-size:12px;cursor:pointer;font-family:inherit;}
.amt-btn.on{background:rgba(201,168,76,.15);border-color:#C9A84C;color:#C9A84C;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <div class="hdr-top">
      <div>
        <div class="brand">AGAPE FAMILY CHRISTIAN CHURCH</div>
        <div class="brand-sub">Jakin &amp; Boaz Education Mission Center</div>
      </div>
      <div class="lang-toggle">
        <button class="lang-btn on" id="btn-ko" onclick="setLang('ko')">한국어</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">ENG</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="body" id="body"></div>
</div>
<div class="toast" id="toast"></div>

<!-- MODALS -->
<div class="modal-ov" id="m-donate" onclick="cm('m-donate')">
<div class="modal-box" onclick="event.stopPropagation()">
  <div class="modal-handle"></div>
  <div class="modal-ttl" id="d-ttl"></div>
  <div class="modal-sub" id="d-sub"></div>
  <div class="amt-grid" id="d-amts"></div>
  <input class="inp" id="d-custom" placeholder="직접 입력 (₩)" oninput="dCustom(this.value)"/>
  <div style="background:rgba(201,168,76,.07);border:1.5px solid rgba(201,168,76,.3);border-radius:12px;padding:14px;margin-bottom:12px">
    <div style="font-size:10px;color:#7A8899;margin-bottom:6px" id="d-bank-lbl">입금 계좌</div>
    <div style="font-size:13px;font-weight:700;color:#FAF6EE;margin-bottom:4px">하나은행 · 김성년</div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:18px;font-weight:700;color:#C9A84C">132-891505-76807</div>
      <button class="edit-btn" onclick="copyAcct()">복사</button>
    </div>
  </div>
  <button class="btn-save" id="d-btn" onclick="submitDonate()">후원 확인</button>
</div></div>

<div class="modal-ov" id="m-notice" onclick="cm('m-notice')">
<div class="modal-box" onclick="event.stopPropagation()">
  <div class="modal-handle"></div>
  <div class="modal-ttl" id="n-ttl">공지 등록</div>
  <label class="lbl" id="n-l1">제목</label>
  <input class="inp" id="n-title" placeholder="제목"/>
  <label class="lbl" id="n-l2">내용</label>
  <textarea class="inp" id="n-body" placeholder="내용" style="min-height:80px;resize:none"></textarea>
  <div style="display:flex;gap:8px">
    <button class="btn-cancel" onclick="cm('m-notice')">취소</button>
    <button class="btn-save" onclick="submitNotice()">등록</button>
  </div>
</div></div>

<div class="modal-ov" id="m-event" onclick="cm('m-event')">
<div class="modal-box" onclick="event.stopPropagation()">
  <div class="modal-handle"></div>
  <div class="modal-ttl" id="ev-ttl">일정 추가</div>
  <div class="g2">
    <div><label class="lbl">월</label><input class="inp-sm" id="ef-m" placeholder="JUN"/></div>
    <div><label class="lbl">일</label><input class="inp-sm" id="ef-d" placeholder="15"/></div>
  </div>
  <label class="lbl">제목</label>
  <input class="inp" id="ef-t" placeholder="일정 제목"/>
  <div class="g2">
    <div><label class="lbl">시간</label><input class="inp-sm" id="ef-time" placeholder="9:30 AM"/></div>
    <div><label class="lbl">장소</label><input class="inp-sm" id="ef-loc" placeholder="본당"/></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:4px">
    <button class="btn-cancel" onclick="cm('m-event')">취소</button>
    <button class="btn-save" onclick="submitEvent()">등록</button>
  </div>
</div></div>

<div class="modal-ov" id="m-worship" onclick="cm('m-worship')">
<div class="modal-box" onclick="event.stopPropagation()">
  <div class="modal-handle"></div>
  <div class="modal-ttl" id="w-ttl">예배 현황 수정</div>
  <div class="modal-sub" id="w-sub">입력 후 저장하세요</div>
  <label class="lbl" id="w-wl">주간</label>
  <input class="inp" id="w-week" placeholder="2026년 5월 18일"/>
  <div id="w-fields"></div>
  <button class="btn-save" onclick="saveWorship()" id="w-save-btn">저장하기</button>
</div></div>

<div class="modal-ov" id="m-finance" onclick="cm('m-finance')">
<div class="modal-box" onclick="event.stopPropagation()">
  <div class="modal-handle"></div>
  <div class="modal-ttl" id="f-ttl">재정 현황 수정</div>
  <label class="lbl" id="f-l1">헌금 수입 (₩)</label><input class="inp" id="f-in" placeholder="1,500,000"/>
  <label class="lbl" id="f-l2">헌금 지출 (₩)</label><input class="inp" id="f-exp" placeholder="800,000"/>
  <label class="lbl" id="f-l3">기타 지출 (₩)</label><input class="inp" id="f-other" placeholder="200,000"/>
  <label class="lbl" id="f-l4">비고</label><input class="inp" id="f-note" placeholder="특이사항"/>
  <button class="btn-save" onclick="saveFinance()" id="f-save-btn">저장하기</button>
</div></div>

<div class="modal-ov" id="m-admin" onclick="cm('m-admin')">
<div class="modal-box" onclick="event.stopPropagation()">
  <div class="modal-handle"></div>
  <div class="modal-ttl" id="a-ttl">🔐 관리자 로그인</div>
  <input class="inp" id="a-pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')loginAdmin()"/>
  <div style="display:flex;gap:8px">
    <button class="btn-cancel" onclick="cm('m-admin')">취소</button>
    <button class="btn-save" onclick="loginAdmin()">로그인</button>
  </div>
</div></div>

<div class="modal-ov" id="m-urgent" onclick="cm('m-urgent')">
<div class="modal-box" onclick="event.stopPropagation()">
  <div class="modal-handle"></div>
  <div class="modal-ttl" id="u-ttl">🚨 긴급 후원 추가</div>
  <label class="lbl">항목명 (한국어)</label><input class="inp" id="u-ko" placeholder="교회학교 여름성경학교"/>
  <label class="lbl">Title (English)</label><input class="inp" id="u-en" placeholder="VBS Summer Camp"/>
  <label class="lbl">목표금액 (숫자만)</label><input class="inp" id="u-goal" placeholder="500000" type="number"/>
  <div style="display:flex;gap:8px">
    <button class="btn-cancel" onclick="cm('m-urgent')">취소</button>
    <button class="btn-save" style="background:linear-gradient(135deg,#D4845A,#C9A84C)" onclick="addUrgent()">추가</button>
  </div>
</div></div>

<div class="modal-ov" id="m-viewer">
<div style="background:#000;width:100%;max-width:430px;height:100vh;display:flex;flex-direction:column;">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.08);">
    <div style="font-size:17px;font-weight:700;color:#FAF6EE" id="vw-ttl"></div>
    <button style="background:rgba(255,255,255,.1);border:none;color:#FAF6EE;font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer" onclick="cm('m-viewer')">✕</button>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px;">
    <img id="vw-img" style="width:100%;max-height:52vh;object-fit:contain;border-radius:12px;display:block" src="" alt=""/>
    <video id="vw-vid" style="width:100%;max-height:52vh;border-radius:12px;display:none" controls playsinline></video>
    <div id="vw-cap" style="font-size:12px;color:#7A8899;margin-top:10px;text-align:center"></div>
  </div>
  <div style="display:flex;align-items:center;gap:18px;padding:10px 16px;justify-content:center">
    <button class="btn-sm" onclick="vwPrev()" id="vw-prev">‹</button>
    <div id="vw-dots" style="display:flex;gap:6px"></div>
    <button class="btn-sm" onclick="vwNext()" id="vw-next">›</button>
  </div>
</div></div>

<script>

var lang=localStorage.getItem("afcc-lang")||"ko";
var isAdmin=false;

  {id:2,month:"MAY",day:"23",tagk:"기도회",tage:"Prayer",titlek:"금요 기도회",titlee:"Friday Night Prayer",time:"7:00 PM",loc:"Prayer Room"},
  {id:3,month:"MAY",day:"24",tagk:"청년부",tage:"Youth",titlek:"청년 예배 및 찬양",titlee:"Youth Fellowship",time:"7:00 PM",loc:"Fellowship Hall"},
  {id:4,month:"JUN",day:"06",tagk:"아카데미",tage:"Academy",titlek:"어린이날 행사",titlee:"Children's Day",time:"8:00 AM",loc:"Education Center"},
  {id:5,month:"JUN",day:"13",tagk:"세미나",tage:"Seminar",titlek:"선교 비즈니스 세미나",titlee:"Mission Business Seminar",time:"2:00 PM",loc:"Room 301"},
];
var _savedMissions=JSON.parse(localStorage.getItem("afcc-missions")||"null");
var missions=(_savedMissions&&_savedMissions[0]&&_savedMissions[0].namek)?_savedMissions:[

function el(tag,attrs,inner){

  return s;
}
function div(style,inner){return '<div style="'+style+'">'+inner+"</div>";}

  var delBtn=urgent&&isAdmin?'<button class="del-btn" onclick="delUrgent('+m.id+')" style="float:right">'+t("삭제","Del")+"</button>":"";

    +'<div><div style="font-size:9px;color:#7A8899;margin-bottom:2px">'+t("목표금액","Goal")+'</div>'
    +'<input class="inp-sm" value="'+m.goal+'" onchange="mGoal('+m.id+',this.value)"/></div>'
    +'<div><div style="font-size:9px;color:#7A8899;margin-bottom:2px">'+t("모금액","Raised")+'</div>'
    +'<input class="inp-sm" value="'+(m.raised||0)+'" onchange="mRaised('+m.id+',this.value)"/></div>'

    +'<div style="margin-bottom:8px"><div style="font-size:9px;color:#7A8899;margin-bottom:2px">'+t("후원자 수","Donors")+'</div>'
    +'<input class="inp-sm" value="'+(m.donors||0)+'" onchange="mDonors('+m.id+',this.value)" style="width:120px"/></div>'
    :"";
  var urgAdminEdit=urgent&&isAdmin?'<div style="margin-bottom:8px"><div style="font-size:9px;color:#7A8899;margin-bottom:2px">'+t("모금액","Raised")+'</div>'
    +'<input class="inp-sm" value="'+(m.raised||0)+'" onchange="uRaised('+m.id+',this.value)" style="border-color:rgba(212,132,90,.4);color:#D4845A"/></div>':"";
  var fillStyle=urgent?"background:linear-gradient(90deg,#D4845A,#C9A84C)":"";

    +'<div class="pbar-row"><span>'+t("목표","Goal")+' \u20A9'+(m.goal/10000).toFixed(0)+t("만원","K")+'</span>'
    +'<span class="pbar-amt">\u20A9'+(m.raised||0).toLocaleString()+'</span></div>'
    +'<div class="pbar"><div class="pbar-fill" style="width:'+pct+'%;'+fillStyle+'"></div></div>'
    +'<div class="mcard-foot"><span style="font-size:11px;color:#7A8899">👥 '+(m.donors||0)+t(" 명 후원"," supporters")+'</span>'
    +'<button class="btn-sm" onclick="openDonate('+m.id+',false)">'+t("후원하기","Support")+'</button></div></div>';

function openDonate(id,isUrgent){
  selMission=isUrgent?urgents.find(function(u){return u.id===id;}):missions.find(function(m){return m.id===id;});

  selAmt=10000;
  document.getElementById("d-ttl").textContent=(selMission.flag||"🇵🇭")+" "+t("선교 후원","Mission Support");
  document.getElementById("d-sub").textContent=ko()?(selMission.namek||""):(selMission.namee||"");
  document.getElementById("d-custom").value="";
  document.getElementById("d-bank-lbl").textContent=t("입금 계좌","Transfer Account");
  document.getElementById("d-btn").textContent=t("₩"+selAmt.toLocaleString()+" 후원 확인","Confirm ₩"+selAmt.toLocaleString());
  var amts=[5000,10000,30000,50000,100000,200000];

    return '<button class="amt-btn'+(a===selAmt?" on":"")+'" onclick="selA('+a+')">₩'+a.toLocaleString()+'</button>';

  om("m-donate");

  var wlabele=["Sunday Service","Student Service","Friday Prayer"];
  var pfx=["s","t","f"];
  document.getElementById("w-fields").innerHTML=wkeys.map(function(k,i){
    return '<div style="background:rgba(255,255,255,.03);border-radius:10px;padding:10px;margin-bottom:10px">'
      +'<div style="font-size:12px;font-weight:700;color:#E5C96A;margin-bottom:8px">✝ '+(ko()?wlabelk[i]:wlabele[i])+'</div>'
      +'<div class="g3">'
      +'<div><label class="lbl">'+t("날짜","Date")+'</label><input class="inp-sm" id="w-'+pfx[i]+'-d" value="'+(wd[k].date||"")+'" placeholder="5/18"/></div>'
      +'<div><label class="lbl">'+t("인원","People")+'</label><input class="inp-sm" id="w-'+pfx[i]+'-a" value="'+(wd[k].att||"")+'" placeholder="45" type="number"/></div>'
      +'<div><label class="lbl">'+t("새신자","New")+'</label><input class="inp-sm" id="w-'+pfx[i]+'-n" value="'+(wd[k].new||"")+'" placeholder="2" type="number"/></div>'
      +'</div></div>';
  }).join("");
  om("m-worship");
}

  wh.unshift(r);

function loginAdmin(){
  if(document.getElementById("a-pw").value===PW){
    isAdmin=true;cm("m-admin");document.getElementById("a-pw").value="";
    toast(t("관리자 모드 활성화 ✅","Admin mode activated ✅"));render();
  } else {toast(t("비밀번호가 틀렸습니다 ❌","Wrong password ❌"));}

function logoutAdmin(){isAdmin=false;toast(t("관리자 모드 종료","Admin mode off"));render();}

function uploadPhoto(input){
  var files=Array.from(input.files);if(!files.length)return;
  var today=new Date().toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
  var loaded=0,photos=[];
  files.forEach(function(f){
    var r=new FileReader();
    r.onload=function(e){
      photos.push({url:e.target.result,cap:f.name.replace(/\.[^.]+$/,"")});
      if(++loaded===files.length){
        var a={id:Date.now(),tk:"업로드 사진",te:"My Upload",date:today,cover:photos[0].url,photos:photos,up:true};
        albums.unshift(a);allAlbums=albums.concat(defaultAlbums);
        try{save();}catch(err){toast(t("용량 초과! 사진을 줄여주세요","Storage full!"));albums.shift();allAlbums=albums.concat(defaultAlbums);return;}
        toast(t("사진이 저장되었습니다 ✅","Photos saved ✅"));render();
      }
    };r.readAsDataURL(f);
  });input.value="";
}
function uploadVideo(input){
  var files=Array.from(input.files);if(!files.length)return;
  var today=new Date().toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
  var f=files[0];var r=new FileReader();
  r.onload=function(e){
    var a={id:Date.now(),tk:"업로드 영상",te:"My Video",date:today,cover:e.target.result,photos:[{url:e.target.result,cap:f.name,vid:true}],vid:true,up:true};
    albums.unshift(a);allAlbums=albums.concat(defaultAlbums);
    try{save();}catch(err){toast(t("용량 초과! 더 작은 파일을 사용하세요","File too large!"));albums.shift();allAlbums=albums.concat(defaultAlbums);return;}
    toast(t("동영상이 저장되었습니다 ✅","Video saved ✅"));render();
  };r.readAsDataURL(f);input.value="";
}
function delAlbum(id){
  albums=albums.filter(function(a){return a.id!==id;});
  allAlbums=albums.concat(defaultAlbums);save();
  toast(t("앨범이 삭제되었습니다","Album deleted"));render();
}

function openViewer(id){
  curAlbum=allAlbums.find(function(a){return a.id===id;});
  if(!curAlbum)return;
  curIdx=0;updateViewer();om("m-viewer");
}
function updateViewer(){
  if(!curAlbum)return;
  var p=curAlbum.photos[curIdx];
  document.getElementById("vw-ttl").textContent=ko()?curAlbum.tk:curAlbum.te;
  var img=document.getElementById("vw-img");
  var vid=document.getElementById("vw-vid");
  if(p.vid){
    img.style.display="none";vid.src=p.url;vid.style.display="block";
  } else {
    vid.style.display="none";vid.src="";img.src=p.url;img.style.display="block";
  }
  document.getElementById("vw-cap").textContent=p.cap||"";
  document.getElementById("vw-prev").disabled=curIdx===0;
  document.getElementById("vw-next").disabled=curIdx===curAlbum.photos.length-1;
  document.getElementById("vw-dots").innerHTML=curAlbum.photos.map(function(_,i){
    return '<div onclick="vwGo('+i+')" style="width:'+(i===curIdx?18:6)+'px;height:6px;border-radius:3px;background:'+(i===curIdx?"#C9A84C":"rgba(255,255,255,.2)")+';cursor:pointer;transition:all .2s"></div>';
  }).join("");
}
function vwPrev(){if(curIdx>0){curIdx--;updateViewer();}}
function vwNext(){if(curAlbum&&curIdx<curAlbum.photos.length-1){curIdx++;updateViewer();}}
function vwGo(i){curIdx=i;updateViewer();}

// ── INIT ──
render();
</script>
