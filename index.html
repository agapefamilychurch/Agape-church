  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; }

}
function storageSave(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

function AlbumViewer({album, lang, onClose}) {
  const [idx, setIdx] = React.useState(0);
  const ph = album.photos[idx];
  return (
    <div className="vw-overlay">
      <div className="vw-hdr">
        <div className="vw-ttl">{lang==="ko"?(album.titleKo||album.title):album.title}</div>
        <button className="vw-close" onClick={onClose}>✕</button>
      </div>
      <div className="vw-main">
        <img className="vw-img" src={ph.url} alt={ph.cap}/>
        <div className="vw-cap">{ph.cap}</div>
      </div>
      <div className="vw-nav">
        <button className="vw-btn" onClick={()=>setIdx(i=>i-1)} disabled={idx===0}>‹</button>
        <div className="vw-dots">
          {album.photos.map((_,i)=>(
            <div key={i} className={"vw-dot"+(i===idx?" on":"")} onClick={()=>setIdx(i)}/>
          ))}
        </div>
        <button className="vw-btn" onClick={()=>setIdx(i=>i+1)} disabled={idx===album.photos.length-1}>›</button>
      </div>
    </div>
  );
}

      if (sn) setNotices(JSON.parse(sn));
      if (sl) setLang(JSON.parse(sl));
    } catch(e) {}
  }, []);

  useEffect(() => { try { localStorage.setItem("afcc-notices", JSON.stringify(notices)); } catch(e) {} }, [notices]);
  useEffect(() => { try { localStorage.setItem("afcc-lang", JSON.stringify(lang)); } catch(e) {} }, [lang]);

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null), 2800); };

  const openDonate = (m) => { setSelMission(m); setShowDonate(true); };

  const submitDonate = () => {
    setShowDonate(false);
    showToast(lang==="ko"?"🙏 감사합니다! 하나님께서 풍성히 갚아 주실 것입니다!":"🙏 Thank you! God bless you abundantly!");
  };

  const handleUpload = (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    const today = new Date().toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
    Promise.all(files.map(f => new Promise(res => {
      const reader = new FileReader();
      reader.onload = ev => res({url:ev.target.result, cap:f.name.replace(/\.[^.]+$/,"")});
      reader.readAsDataURL(f);
    }))).then(newPhotos => {
      const newAlbum = {id:Date.now(),title:"My Upload",titleKo:"업로드 사진",date:today,cover:newPhotos[0].url,photos:newPhotos};
      setAlbums(prev => [newAlbum, ...prev]);
      showToast(lang==="ko"?"사진이 업로드되었습니다! ✅":"Photos uploaded! ✅");
    });
    e.target.value = "";
  };

  const submitNotice = () => {
    if (!nfTitle.trim()) return;
    const today = new Date().toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
    setNotices(prev=>[{id:Date.now(),date:today,titleEn:nfTitle,titleKo:nfTitle,bodyEn:nfBody,bodyKo:nfBody},...prev]);
    setNfTitle(""); setNfBody(""); setShowNoticeForm(false);
    showToast(lang==="ko"?"공지가 등록되었습니다 ✅":"Notice posted ✅");
  };

  const deleteNotice = (id) => setNotices(prev=>prev.filter(n=>n.id!==id));

  const shareKakao = () => {
    const txt = lang==="ko"
      ? "아가페 패밀리 크리스챤 교회 | 야긴보아즈 교육선교센터\n선교 후원에 함께해 주세요! 🙏\nagape-church.vercel.app"
      : "Agape Family Christian Church | Jakin & Boaz Education Mission Center\nJoin us in supporting world missions! 🙏\nagape-church.vercel.app";
    if (navigator.share) navigator.share({title:"AFCC Mission",text:txt}).catch(()=>{});
    else navigator.clipboard?.writeText(txt);
    showToast(lang==="ko"?"카카오톡으로 공유합니다 💛":"Sharing via KakaoTalk 💛");
  };

  const ko = lang==="ko";
  const AMTS = [5000,10000,30000,50000,100000,200000];
  const TABS = ko
    ? [{id:"home",ic:"🏠",l:"홈"},{id:"mission",ic:"🌍",l:"선교"},{id:"gallery",ic:"📷",l:"갤러리"},{id:"notice",ic:"📢",l:"공지"},{id:"donate",ic:"🙏",l:"후원"},{id:"about",ic:"✝️",l:"소개"}]
    : [{id:"home",ic:"🏠",l:"Home"},{id:"mission",ic:"🌍",l:"Mission"},{id:"gallery",ic:"📷",l:"Gallery"},{id:"notice",ic:"📢",l:"Notice"},{id:"donate",ic:"🙏",l:"Support"},{id:"about",ic:"✝️",l:"About"}];

  const MCard = ({m}) => {
    const pct = Math.round((m.raised/m.goal)*100);
    return (
      <div className="mcard">
        <div style={{display:"flex",gap:10,marginBottom:8}}>
          <span style={{fontSize:24}}>{m.flag}</span>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
              <div className="mloc">{m.country} · {m.area}</div>
              <span style={{fontSize:9,background:"rgba(201,168,76,.18)",color:C.gold,border:"1px solid rgba(201,168,76,.35)",borderRadius:10,padding:"1px 7px",fontWeight:700}}>
                {ko?m.tagKo:m.tag}
              </span>
            </div>
            <div className="mname">{ko?m.nameKo:m.name}</div>
          </div>
        </div>
        <div className="mdesc">{ko?m.descKo:m.desc}</div>
        <div className="pbar-lbl">
          <span>{ko?"목표":"Goal"} ₱{(m.goal/1000).toFixed(0)}K</span>
          <span className="pbar-amt">₱{m.raised.toLocaleString()}</span>
        </div>
        <div className="pbar"><div className="pbar-fill" style={{width:pct+"%"}}/></div>
        <div className="mcard-foot">
          <span className="mdonors">👥 {m.donors} {ko?"명 후원":"supporters"}</span>
          <button className="btn-sm" onClick={()=>openDonate(m)}>{ko?"후원하기":"Support"}</button>
        </div>
      </div>
    );
  };

  const Home = () => (
    <>
      <div className="hero">
        <div className="hero-eye">✝ Agape Family Christian Church</div>
        <div className="hero-ttl">{ko?"열방을 향해\n나아가는 교회":"Going to\nAll Nations"}</div>
        <div className="hero-verse">{ko?"오직 우리 주 곧 구주 예수 그리스도의 은혜와 그를 아는 지식에서 자라 가라 — 베드로후서 3:18":"But grow in the grace and knowledge of our Lord and Savior Jesus Christ. — 2 Peter 3:18"}</div>
        <div className="hero-btns">
          <button className="btn-g" onClick={()=>setTab("donate")}>{ko?"후원하기":"Support Now"}</button>
          <button className="btn-o" onClick={()=>setTab("about")}>{ko?"교회소개":"About Us"}</button>
        </div>
      </div>
      <div className="stats">
        {[["12",ko?"선교 국가":"Mission Countries"],["38",ko?"파송 선교사":"Missionaries"],["2,400",ko?"월 후원자":"Monthly Donors"]].map(([n,l],i)=>(
          <div className="stat" key={i}><div className="stat-n">{n}</div><div className="stat-l">{l}</div></div>
        ))}
      </div>
      <div className="sec" style={{marginTop:18}}>
        <div className="sec-hdr">
          <div className="sec-ttl">{ko?"다가오는 일정":"Upcoming Events"}</div>
          <div className="see-all" onClick={()=>setTab("events")}>{ko?"전체보기":"See all"}</div>
        </div>
        {EVENTS.slice(0,2).map((e,i)=>(
          <div className="ecard" key={i}>
            <div className="ebox"><div className="emon">{e.month}</div><div className="eday">{e.day}</div></div>
            <div><div className="etag">{ko?e.tagKo:e.tag}</div><div className="ettl">{ko?e.titleKo:e.title}</div>
            <div className="emeta">🕐 {e.time} · 📍 {e.loc}</div></div>
          </div>
        ))}
      </div>
      <div className="sec" style={{marginTop:16,paddingBottom:20}}>
        <div className="sec-hdr">
          <div className="sec-ttl">{ko?"긴급 선교 후원":"Featured Mission"}</div>
          <div className="see-all" onClick={()=>setTab("mission")}>{ko?"전체보기":"See all"}</div>
        </div>
        <MCard m={MISSIONS[0]}/>
      </div>
    </>
  );

  const Mission = () => (
    <div className="sec" style={{paddingTop:18,paddingBottom:18}}>
      <div className="sec-ttl" style={{marginBottom:14}}>{ko?"진행 중인 선교":"Active Missions"}</div>
      {MISSIONS.map(m=><MCard key={m.id} m={m}/>)}
    </div>
  );

  const Gallery = () => (
    <>
      <div className="sec" style={{paddingTop:18,paddingBottom:12}}>
        <div className="sec-hdr"><div className="sec-ttl">{ko?"사진 갤러리":"Photo Gallery"}</div></div>
        <div style={{fontSize:11,color:C.muted,marginBottom:14}}>{ko?"앨범을 탭하면 사진을 볼 수 있습니다":"Tap an album to view photos"}</div>
        <div className="upload-area" onClick={()=>fileRef.current.click()}>
          <div className="upload-lbl">{ko?"📷 사진 업로드":"📷 Upload Photos"}</div>
          <div className="upload-hint">{ko?"기기에서 사진을 선택하세요":"Tap to select photos from your device"}</div>
        </div>
        <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={handleUpload}/>
      </div>
      <div className="gal-grid">
        {albums.map(a=>(
          <div className="alb" key={a.id} onClick={()=>setSelAlbum(a)}>
            <img className="alb-img" src={a.cover} alt={a.title}/>
            <div className="alb-info">
              <div className="alb-ttl">{ko?(a.titleKo||a.title):a.title}</div>
              <div className="alb-meta">{a.date} · {a.photos.length} photos</div>
            </div>
          </div>
        ))}
      </div>
    </>
  );

  const Notice = () => (
    <>
      <div className="sec" style={{paddingTop:18,paddingBottom:12}}>
        <div className="sec-hdr">
          <div className="sec-ttl">{ko?"공지사항":"Announcements"}</div>
          <div style={{fontSize:10,color:C.green,background:"rgba(42,110,73,.15)",border:"1px solid rgba(42,110,73,.3)",borderRadius:10,padding:"3px 9px"}}>💾 {ko?"자동저장":"Auto-saved"}</div>
        </div>
      </div>
      <button className="notice-add-btn" onClick={()=>setShowNoticeForm(v=>!v)}>
        {showNoticeForm?(ko?"✕ 닫기":"✕ Close"):(ko?"+ 공지 등록":"+ Add Notice")}
      </button>
      {showNoticeForm && (
        <div className="notice-form">
          <input className="nf-input" placeholder={ko?"제목":"Title"} value={nfTitle} onChange={e=>setNfTitle(e.target.value)}/>
          <textarea className="nf-textarea" placeholder={ko?"내용":"Content"} value={nfBody} onChange={e=>setNfBody(e.target.value)}/>
          <div className="nf-btns">
            <button className="nf-cancel" onClick={()=>{setShowNoticeForm(false);setNfTitle("");setNfBody("");}}>{ko?"취소":"Cancel"}</button>
            <button className="nf-submit" onClick={submitNotice}>{ko?"등록":"Post"}</button>
          </div>
        </div>
      )}
      <div className="notice-list">
        {notices.length===0 && <div style={{textAlign:"center",color:C.muted,fontSize:13,padding:"20px 0"}}>{ko?"등록된 공지사항이 없습니다.":"No announcements yet."}</div>}
        {notices.map(n=>(
          <div className="notice-card" key={n.id}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div className="notice-date">{n.date}</div>
              <button onClick={()=>deleteNotice(n.id)} style={{background:"rgba(192,57,43,.15)",border:"1px solid rgba(192,57,43,.3)",color:"#e07060",borderRadius:8,padding:"2px 9px",fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>{ko?"삭제":"Delete"}</button>
            </div>
            <div className="notice-ttl">{ko?n.titleKo:n.titleEn}</div>
            <div className="notice-body">{ko?n.bodyKo:n.bodyEn}</div>
          </div>
        ))}
      </div>
    </>
  );

  const Donate = () => (
    <div style={{padding:16}}>
      <div style={{marginBottom:16}}>
        <div className="sec-ttl">{ko?"선교 후원":"Mission Support"}</div>
        <div style={{fontSize:12,color:C.muted,marginTop:4}}>{ko?"여러분의 후원이 열방을 변화시킵니다":"Your support transforms the nations"}</div>
      </div>
      <button className="kakao-btn" onClick={shareKakao}>
        💛 {ko?"카카오톡으로 공유":"Share on KakaoTalk"}
      </button>
      {MISSIONS.map(m=>(
        <div key={m.id} className="mcard" style={{marginBottom:14}}>
          <div style={{display:"flex",gap:10,marginBottom:8}}>
            <span style={{fontSize:24}}>{m.flag}</span>
            <div><div className="mloc">{m.country}</div><div className="mname">{ko?m.nameKo:m.name}</div></div>
          </div>
          <div className="pbar-lbl">
            <span>{Math.round((m.raised/m.goal)*100)}% funded</span>
            <span className="pbar-amt">₱{m.raised.toLocaleString()}</span>
          </div>
          <div className="pbar"><div className="pbar-fill" style={{width:Math.round((m.raised/m.goal)*100)+"%"}}/></div>
          <button className="btn-g" style={{width:"100%",marginTop:12}} onClick={()=>openDonate(m)}>
            {ko?"이 선교 후원하기":"Support this Mission"}
          </button>
        </div>
      ))}
      <div className="acard">
        <div className="acard-ttl">🏦 {ko?"하나은행 계좌이체":"Hana Bank Transfer"}</div>
        <div className="bank-box">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:10,color:C.muted}}>{ko?"은행":"BANK"}</span>
            <span style={{fontSize:14,fontWeight:700,color:C.cream}}>{ko?"하나은행":"Hana Bank"}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:10,color:C.muted}}>{ko?"예금주":"ACCOUNT HOLDER"}</span>
            <span style={{fontSize:14,fontWeight:700,color:C.cream}}>김성년 (Kim Sung Nyun)</span>
          </div>
          <div style={{borderTop:"1px solid rgba(201,168,76,.2)",paddingTop:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:10,color:C.muted,marginBottom:3}}>{ko?"계좌번호":"ACCOUNT NO."}</div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,fontWeight:700,color:C.gold,letterSpacing:1}}>132-891505-76807</div>
            </div>
            <button onClick={()=>{navigator.clipboard?.writeText("13289150576807");showToast(ko?"계좌번호가 복사되었습니다 ✅":"Account number copied ✅");}}
              style={{background:"rgba(201,168,76,.2)",border:"1px solid rgba(201,168,76,.5)",color:C.gold,borderRadius:10,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              {ko?"복사":"Copy"}
            </button>
          </div>
        </div>
        <div style={{fontSize:11,color:"rgba(250,246,238,.65)",lineHeight:1.7}}>{ko?"* 입금 후 카카오톡으로 성함과 후원 목적을 알려주시면 감사합니다":"* After transfer, please send your name & purpose via KakaoTalk"}</div>
      </div>
    </div>
  );

  const About = () => (
    <div style={{padding:16}}>
      <div className="acard">
        <div className="acard-ttl">✝ {ko?"교회 소개":"About the Church"}</div>
        <div style={{fontSize:12,color:"rgba(250,246,238,.75)",lineHeight:1.75}}>
          <strong style={{color:C.goldLt}}>Agape Family Christian Church</strong><br/>
          아가페 패밀리 크리스챤 교회<br/><br/>
          <em style={{color:C.gold}}>Jakin and Boaz Education Mission Center<br/>야긴보아즈 교육선교센터</em><br/><br/>
          Founded 2010 · San Mateo, Rizal, Philippines<br/><br/>
          <em style={{color:C.muted}}>"Mature Faith, Better Life" — 2 Peter 3:18</em>
        </div>
      </div>
      <div className="acard">
        <div className="acard-ttl">🕊 {ko?"예배 시간":"Worship Schedule"}</div>
        {(ko?[
          {label:"주일 예배",time:"일요일 오전 9:30"},
          {label:"금요 기도회",time:"금요일 오후 7:00–8:00"},
          {label:"청년 모임",time:"매 2·4주 토요일 오후 7:00–8:00"},
          {label:"티모시 아카데미",time:"화 오전 8–10시 · 목/토 오후 1:30–4:00"},
        ]:[
          {label:"General Worship Service",time:"Sunday, 9:30 am"},
          {label:"Prayer Meeting",time:"Friday, 7:00–8:00 pm"},
          {label:"Youth Fellowship",time:"Every 2nd & 4th Saturday 7:00–8:00 pm"},
          {label:"Timothy Academy",time:"Tue 8–10 am · Thu/Sat 1:30–4:00 pm"},
        ]).map((s,i)=>(
          <div key={i} style={{padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,.04)"}}>
            <div style={{fontSize:11,color:C.gold,marginBottom:2}}>✝ {s.label}</div>
            <div style={{fontSize:12,color:C.cream}}>{s.time}</div>
          </div>
        ))}
      </div>
      <div className="acard">
        <div className="acard-ttl">👥 {ko?"교역자 소개":"Church Leadership"}</div>
        {STAFF.map((s,i)=>(
          <div className="staff-row" key={i}>
            <span style={{fontSize:11,color:C.muted}}>{ko?s.roleKo:s.role}</span>
            <span style={{fontSize:12,color:C.cream,fontWeight:500}}>{s.name}</span>
          </div>
        ))}
      </div>
      <div className="acard">
        <div className="acard-ttl">📞 {ko?"연락처":"Contact"}</div>
        {[
          {ic:"📍",label:ko?"주소":"Address",val:"No. 4, Dama De Noche St., Doña Pepeng, Banaba, San Mateo, Rizal"},
          {ic:"📞",label:ko?"전화":"Phone",val:"028-733-7427"},
          {ic:"🏫",label:ko?"티모시 아카데미":"Timothy Academy",val:"Tue 8–10am · Thu/Sat 1:30–4pm"},
        ].map((c,i)=>(
          <div className="contact-row" key={i}>
            <div className="cicon">{c.ic}</div>
            <div><div style={{fontSize:10,color:C.muted}}>{c.label}</div><div style={{fontSize:12,color:C.cream,fontWeight:500}}>{c.val}</div></div>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <>
      <style>{CSS}</style>
      <div className="shell">
        <div className="hdr">
          <div className="hdr-top">
            <div>
              <div className="brand-en">AGAPE FAMILY CHRISTIAN CHURCH</div>
              <div className="brand-sub">Jakin & Boaz Education Mission Center</div>
            </div>
            <div className="lang-toggle">
              <button className={"lang-btn"+(lang==="ko"?" on":"")} onClick={()=>setLang("ko")}>한국어</button>
              <button className={"lang-btn"+(lang==="en"?" on":"")} onClick={()=>setLang("en")}>ENG</button>
            </div>
          </div>
          <div className="tabs">
            {TABS.map(t=>(
              <button key={t.id} className={"tab"+(tab===t.id?" on":"")} onClick={()=>setTab(t.id)}>
                <span className="tab-ic">{t.ic}</span>{t.l}
              </button>
            ))}
          </div>
        </div>
        <div className="body">
          {tab==="home" && <Home/>}
          {tab==="mission" && <Mission/>}
          {tab==="gallery" && <Gallery/>}
          {tab==="notice" && <Notice/>}
          {tab==="donate" && <Donate/>}
          {tab==="about" && <About/>}
        </div>
        {selAlbum && <AlbumViewer album={selAlbum} lang={lang} onClose={()=>setSelAlbum(null)}/>}
        {showDonate && (
          <div className="modal-ov" onClick={()=>setShowDonate(false)}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
              <div className="modal-handle"/>
              <div className="modal-ttl">{selMission?.flag} {ko?"선교 후원":"Mission Support"}</div>
              <div className="modal-sub">{ko?selMission?.nameKo:selMission?.name}</div>
              <div className="amt-grid">
                {AMTS.map(a=>(
                  <button key={a} className={"amt-btn"+(selAmt===a?" on":"")} onClick={()=>{setSelAmt(a);setCustAmt("");}}>
                    ₩{a.toLocaleString()}
                  </button>
                ))}
              </div>
              <input className="cinput" placeholder={ko?"직접 입력 (₩)":"Custom amount (₩)"} value={custAmt}
                onChange={e=>{setCustAmt(e.target.value);setSelAmt(null);}}/>
              <div className="bank-box" style={{marginBottom:14}}>
                <div style={{fontSize:10,color:C.muted,marginBottom:6}}>{ko?"입금 계좌":"Transfer Account"}</div>
                <div style={{fontSize:13,fontWeight:700,color:C.cream,marginBottom:3}}>{ko?"하나은행 · 김성년":"Hana Bank · Kim Sung Nyun"}</div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,color:C.gold,fontWeight:700}}>132-891505-76807</div>
                  <button onClick={()=>{navigator.clipboard?.writeText("13289150576807");showToast(ko?"복사됨 ✅":"Copied ✅");}}
                    style={{background:"rgba(201,168,76,.2)",border:"1px solid rgba(201,168,76,.4)",color:C.gold,borderRadius:8,padding:"5px 12px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                    {ko?"복사":"Copy"}
                  </button>
                </div>
              </div>
              <button className="btn-donate" onClick={submitDonate}>
                {ko?"후원 확인":"Confirm Donation"} ₩{custAmt?parseInt(custAmt||0).toLocaleString():(selAmt?.toLocaleString()||"0")}
              </button>
            </div>
          </div>
        )}
        {toast && <div className="toast">{toast}</div>}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
