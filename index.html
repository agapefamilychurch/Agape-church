<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#07111F"/>
<title>아가페 패밀리 크리스챤 교회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#07111F;color:#FAF6EE;min-height:100vh;overflow-x:hidden;}
.shell{max-width:430px;margin:0 auto;min-height:100vh;background:#07111F;display:flex;flex-direction:column;}
.hdr{background:#0D1E35;padding:14px 16px 0;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(201,168,76,.18);}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.brand-en{font-size:12px;font-weight:700;color:#C9A84C;line-height:1.2;}
.brand-sub{font-size:9px;color:rgba(201,168,76,.6);margin-top:1px;}
.lang-toggle{display:flex;background:rgba(255,255,255,.06);border-radius:20px;overflow:hidden;border:1px solid rgba(201,168,76,.18);}
.lang-btn{padding:5px 11px;border:none;background:none;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:#7A8899;}
.lang-btn.on{background:#C9A84C;color:#07111F;font-weight:700;}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:8px 12px;background:none;border:none;border-bottom:2px solid transparent;color:#7A8899;font-size:10px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab.on{color:#C9A84C;border-bottom-color:#C9A84C;}
.tab-ic{font-size:16px;}
.body{flex:1;overflow-y:auto;padding-bottom:24px;}
.page{display:none;padding:16px;}
.page.on{display:block;}
.hero{background:linear-gradient(160deg,#132844 0%,#152e52 55%,#0b2040 100%);padding:24px 16px 22px;}
.hero-eye{font-size:10px;color:#C9A84C;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.hero-ttl{font-size:26px;font-weight:700;color:#fff;line-height:1.25;margin-bottom:5px;}
.hero-verse{font-size:11px;color:rgba(250,246,238,.6);font-style:italic;line-height:1.6;margin-bottom:18px;border-left:2px solid rgba(201,168,76,.35);padding-left:10px;}
.hero-btns{display:flex;gap:10px;}
.btn-g{background:linear-gradient(135deg,#C9A84C,#8C6E28);color:#07111F;border:none;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.btn-o{background:transparent;color:#C9A84C;border:1.5px solid #C9A84C;padding:11px 18px;border-radius:24px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.sec{padding:18px 16px 0;}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sec-ttl{font-size:18px;font-weight:700;color:#FAF6EE;}
.see-all{font-size:11px;color:#C9A84C;cursor:pointer;background:none;border:none;font-family:'Noto Sans KR',sans-serif;}
.card{background:#0D1E35;border:1px solid rgba(201,168,76,.18);border-radius:16px;padding:16px;margin-bottom:12px;}
.card-ttl{font-size:15px;font-weight:700;color:#C9A84C;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.ecard{background:#0D1E35;border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:13px;display:flex;gap:12px;margin-bottom:10px;}
.ebox{min-width:42px;background:linear-gradient(135deg,#C9A84C,#8C6E28);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 4px;}
.emon{font-size:8px;font-weight:700;color:#07111F;letter-spacing:1px;}
.eday{font-size:21px;font-weight:700;color:#07111F;line-height:1;}
.etag{font-size:9px;color:#D4845A;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.ettl{font-size:13px;font-weight:600;color:#fff;margin-bottom:3px;}
.emeta{font-size:11px;color:#7A8899;}
.mcard{background:#0D1E35;border:1px solid rgba(201,168,76,.18);border-radius:16px;padding:15px;margin-bottom:12px;position:relative;overflow:hidden;}
.mcard::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(#C9A84C,#D4845A);}
.mloc{font-size:10px;color:#C9A84C;letter-spacing:1.5px;text-transform:uppercase;}
.mname{font-size:15px;font-weight:700;color:#fff;}
.mdesc{font-size:11px;color:#7A8899;line-height:1.5;margin:6px 0 10px;}
.pbar-lbl{display:flex;justify-content:space-between;font-size:11px;color:#7A8899;margin-bottom:4px;}
.pbar-amt{color:#C9A84C;font-weight:700;}
.pbar{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
.pbar-fill{height:100%;background:linear-gradient(90deg,#C9A84C,#D4845A);border-radius:3px;}
.mcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.mdonors{font-size:11px;color:#7A8899;}
.btn-sm{background:rgba(201,168,76,.12);color:#C9A84C;border:1px solid rgba(201,168,76,.4);padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.alb{background:#0D1E35;border-radius:14px;overflow:hidden;border:1px solid rgba(201,168,76,.18);cursor:pointer;}
.alb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
.alb-info{padding:9px 10px 11px;}
.alb-ttl{font-size:12px;font-weight:600;color:#FAF6EE;margin-bottom:2px;}
.alb-meta{font-size:10px;color:#7A8899;}
.notice-card{background:#0D1E35;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:15px;margin-bottom:10px;}
.notice-date{font-size:10px;color:#7A8899;margin-bottom:4px;}
.notice-ttl{font-size:14px;font-weight:600;color:#FAF6EE;margin-bottom:5px;}
.notice-body{font-size:12px;color:rgba(250,246,238,.65);line-height:1.65;}
.add-btn{display:block;width:100%;padding:13px;background:rgba(201,168,76,.1);border:1.5px dashed rgba(201,168,76,.4);border-radius:14px;color:#C9A84C;font-size:13px;font-weight:600;cursor:pointer;text-align:center;font-family:'Noto Sans KR',sans-serif;margin-bottom:14px;}
.bank-box{background:rgba(201,168,76,.07);border:1.5px solid rgba(201,168,76,.3);border-radius:12px;padding:16px 14px;margin-bottom:12px;}
.kakao-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:#FEE500;border:none;border-radius:14px;color:#3A1D1D;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-bottom:10px;}
.worship-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center;}
.worship-cell{background:rgba(201,168,76,.06);border-radius:8px;padding:8px 4px;}
.worship-lbl{font-size:9px;color:#7A8899;margin-bottom:3px;}
.worship-val{font-size:15px;font-weight:700;color:#C9A84C;}
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fin-cell{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.05);}
.fin-lbl{font-size:10px;color:#7A8899;margin-bottom:4px;}
.fin-val{font-size:13px;font-weight:700;word-break:break-all;}
.staff-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.staff-role{font-size:11px;color:#7A8899;}
.staff-name{font-size:12px;color:#FAF6EE;font-weight:500;}
.contact-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.c-icon{width:34px;height:34px;background:rgba(201,168,76,.1);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#2A6E49;color:#fff;padding:11px 22px;border-radius:22px;font-size:13px;font-weight:600;z-index:400;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;display:none;}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-ov.on{display:flex;}
.modal-box{background:#0D1E35;border-radius:22px 22px 0 0;padding:20px 18px 40px;width:100%;max-width:430px;border-top:1px solid rgba(201,168,76,.3);max-height:88vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:0 auto 16px;}
.modal-ttl{font-size:20px;font-weight:700;color:#FAF6EE;margin-bottom:4px;}
.modal-sub{font-size:12px;color:#7A8899;margin-bottom:16px;}
.inp{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(201,168,76,.3);border-radius:10px;padding:12px 14px;color:#FAF6EE;font-size:15px;font-family:'Noto Sans KR',sans-serif;margin-bottom:12px;outline:none;}
.inp:focus{border-color:#C9A84C;}
.lbl{font-size:11px;color:#C9A84C;margin-bottom:4px;display:block;font-weight:600;}
.btn-save{width:100%;padding:14px;background:linear-gradient(135deg,#C9A84C,#8C6E28);border:none;border-radius:14px;color:#07111F;font-size:15px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:8px;}
.btn-cancel{padding:10px 18px;background:rgba(255,255,255,.06);border:none;border-radius:10px;color:#7A8899;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.edit-btn{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);color:#C9A84C;border-radius:8px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.del-btn{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.3);color:#e07060;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.tag{font-size:9px;border-radius:10px;padding:1px 7px;font-weight:700;}
.tag-gold{background:rgba(201,168,76,.18);color:#C9A84C;border:1px solid rgba(201,168,76,.35);}
.tag-amber{background:rgba(212,132,90,.2);color:#D4845A;border:1px solid rgba(212,132,90,.4);}
.inp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.inp-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;}
.inp-sm{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(201,168,76,.3);border-radius:8px;padding:10px 10px;color:#FAF6EE;font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;}
.inp-sm:focus{border-color:#C9A84C;}
.upload-area{border:2px dashed rgba(201,168,76,.3);border-radius:14px;padding:20px;text-align:center;cursor:pointer;background:rgba(201,168,76,.04);margin-bottom:14px;}
.amt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.amt-btn{padding:11px 6px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.09);border-radius:12px;color:#FAF6EE;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.amt-btn.on{background:rgba(201,168,76,.15);border-color:#C9A84C;color:#C9A84C;}
.vision-big{display:block;text-align:center;font-size:22px;font-weight:700;color:#C9A84C;margin:10px 0 4px;letter-spacing:1px;}
</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <div class="hdr-top">
      <div>
        <div class="brand-en">AGAPE FAMILY CHRISTIAN CHURCH</div>
        <div class="brand-sub">Jakin &amp; Boaz Education Mission Center</div>
      </div>
      <div class="lang-toggle">
        <button class="lang-btn on" onclick="setLang('ko')" id="btn-ko">한국어</button>
        <button class="lang-btn" onclick="setLang('en')" id="btn-en">ENG</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="body" id="body"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODALS -->
<div class="modal-ov" id="modal-donate" onclick="closeModal('modal-donate')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-ttl" id="donate-ttl">선교 후원</div>
    <div class="modal-sub" id="donate-sub"></div>
    <div class="amt-grid" id="amt-grid"></div>
    <input class="inp" id="custom-amt" placeholder="직접 입력 (₩)" oninput="updateCustomAmt(this.value)"/>
    <div class="bank-box" style="margin-bottom:14px">
      <div style="font-size:10px;color:#7A8899;margin-bottom:6px" id="d-bank-lbl">입금 계좌</div>
      <div style="font-size:13px;font-weight:700;color:#FAF6EE;margin-bottom:4px">하나은행 · 김성년</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:18px;font-weight:700;color:#C9A84C">132-891505-76807</div>
        <button class="edit-btn" onclick="copyAcct()">복사</button>
      </div>
    </div>
    <button class="btn-save" id="donate-submit" onclick="submitDonate()">후원 확인</button>
  </div>
</div>

<div class="modal-ov" id="modal-notice" onclick="closeModal('modal-notice')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-ttl" id="notice-modal-ttl">공지 등록</div>
    <label class="lbl" id="lbl-ntitle">제목</label>
    <input class="inp" id="notice-title-inp" placeholder="제목"/>
    <label class="lbl" id="lbl-nbody">내용</label>
    <textarea class="inp" id="notice-body-inp" placeholder="내용" style="min-height:80px;resize:none"></textarea>
    <div style="display:flex;gap:8px">
      <button class="btn-cancel" onclick="closeModal('modal-notice')" id="lbl-cancel">취소</button>
      <button class="btn-save" onclick="submitNotice()" id="lbl-submit">등록</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-event" onclick="closeModal('modal-event')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-ttl" id="event-modal-ttl">일정 추가</div>
    <div class="inp-grid2">
      <div><label class="lbl" id="lbl-emon">월</label><input class="inp-sm" id="ef-month" placeholder="JUN"/></div>
      <div><label class="lbl" id="lbl-eday">일</label><input class="inp-sm" id="ef-day" placeholder="15"/></div>
    </div>
    <label class="lbl" id="lbl-etitle">제목</label>
    <input class="inp" id="ef-title" placeholder="일정 제목"/>
    <div class="inp-grid2">
      <div><label class="lbl" id="lbl-etime">시간</label><input class="inp-sm" id="ef-time" placeholder="9:30 AM"/></div>
      <div><label class="lbl" id="lbl-eloc">장소</label><input class="inp-sm" id="ef-loc" placeholder="본당"/></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn-cancel" onclick="closeModal('modal-event')" id="lbl-ecancel">취소</button>
      <button class="btn-save" onclick="submitEvent()" id="lbl-esubmit">등록</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-worship" onclick="closeModal('modal-worship')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-ttl" id="worship-modal-ttl">예배 현황 수정</div>
    <div class="modal-sub" id="worship-modal-sub">입력 후 저장 버튼을 눌러주세요</div>
    <label class="lbl" id="lbl-wweek">주간</label>
    <input class="inp" id="w-week" placeholder="2026년 5월 18일"/>
    <div id="worship-fields"></div>
    <button class="btn-save" onclick="saveWorship()" id="lbl-wsave">저장하기</button>
  </div>
</div>

<div class="modal-ov" id="modal-finance" onclick="closeModal('modal-finance')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-ttl" id="finance-modal-ttl">재정 현황 수정</div>
    <label class="lbl" id="lbl-fincome">헌금 수입 (₩)</label>
    <input class="inp" id="f-income" placeholder="1,500,000"/>
    <label class="lbl" id="lbl-fexpense">헌금 지출 (₩)</label>
    <input class="inp" id="f-expense" placeholder="800,000"/>
    <label class="lbl" id="lbl-fother">기타 지출 (₩)</label>
    <input class="inp" id="f-other" placeholder="200,000"/>
    <label class="lbl" id="lbl-fnote">비고</label>
    <input class="inp" id="f-note" placeholder="특이사항"/>
    <button class="btn-save" onclick="saveFinance()" id="lbl-fsave">저장하기</button>
  </div>
</div>

<div class="modal-ov" id="modal-admin" onclick="closeModal('modal-admin')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-ttl" id="admin-modal-ttl">🔐 관리자 로그인</div>
    <input class="inp" id="admin-pw" type="password" placeholder="비밀번호"/>
    <div style="display:flex;gap:8px">
      <button class="btn-cancel" onclick="closeModal('modal-admin')" id="lbl-acancel">취소</button>
      <button class="btn-save" onclick="loginAdmin()" id="lbl-alogin">로그인</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-urgent" onclick="closeModal('modal-urgent')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-ttl" id="urgent-modal-ttl">🚨 긴급 후원 추가</div>
    <label class="lbl" id="lbl-unameko">항목명 (한국어)</label>
    <input class="inp" id="u-nameko" placeholder="긴급 의료비 지원"/>
    <label class="lbl" id="lbl-unameen">Title (English)</label>
    <input class="inp" id="u-nameen" placeholder="Emergency Medical"/>
    <label class="lbl" id="lbl-ugoal">목표금액 (숫자만)</label>
    <input class="inp" id="u-goal" placeholder="500000" type="number"/>
    <div style="display:flex;gap:8px">
      <button class="btn-cancel" onclick="closeModal('modal-urgent')" id="lbl-ucancel">취소</button>
      <button class="btn-save" style="background:linear-gradient(135deg,#D4845A,#C9A84C)" onclick="addUrgent()" id="lbl-usubmit">추가</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-viewer">
  <div style="background:#000;width:100%;max-width:430px;height:100vh;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.08);">
      <div style="font-size:17px;font-weight:700;color:#FAF6EE;" id="viewer-ttl"></div>
      <button style="background:rgba(255,255,255,.1);border:none;color:#FAF6EE;font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer;" onclick="closeModal('modal-viewer')">✕</button>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px;">
      <img id="viewer-img" style="width:100%;max-height:55vh;object-fit:contain;border-radius:12px;" src="" alt=""/>
      <div id="viewer-cap" style="font-size:12px;color:#7A8899;margin-top:10px;text-align:center;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:18px;padding:10px 16px;justify-content:center;">
      <button class="btn-sm" onclick="viewerPrev()" id="viewer-prev">‹</button>
      <div id="viewer-dots" style="display:flex;gap:6px;"></div>
      <button class="btn-sm" onclick="viewerNext()" id="viewer-next">›</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────
const ADMIN_PW = "20261004";
let lang = localStorage.getItem("afcc-lang")||"ko";
let isAdmin = false;
let currentTab = "home";
let selAmt = 10000;
let selMission = null;
let currentAlbum = null;
let currentPhotoIdx = 0;

const ko = ()=>lang==="ko";

// Data

function handleUpload(input){
  const files=Array.from(input.files);
  if(!files.length)return;
  const today=new Date().toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
  let loaded=0;
  const photos=[];
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      photos.push({url:e.target.result,cap:f.name.replace(/\.[^.]+$/,"")});
      if(++loaded===files.length){
        const newAlbum={id:Date.now(),titleKo:"업로드 사진",titleEn:"My Upload",date:today,cover:photos[0].url,photos,uploaded:true};
        albums.unshift(newAlbum);
        save();
        showToast(ko()?"사진이 저장되었습니다 ✅":"Photos saved ✅");
        renderBody();
      }
    };
    r.readAsDataURL(f);
  });
  input.value="";
}

function deleteAlbum(id){
  albums=albums.filter(a=>a.id!==id);
  save();
  showToast(ko()?"앨범이 삭제되었습니다":"Album deleted");
  renderBody();
}

function openViewer(albumId){
  currentAlbum=albums.find(a=>a.id===albumId);
  currentPhotoIdx=0;
  updateViewer();
  openModal("modal-viewer");
}
function updateViewer(){
  if(!currentAlbum)return;
  const p=currentAlbum.photos[currentPhotoIdx];
  document.getElementById("viewer-ttl").textContent=ko()?currentAlbum.titleKo:currentAlbum.titleEn;
  document.getElementById("viewer-img").src=p.url;
  document.getElementById("viewer-cap").textContent=p.cap;
  document.getElementById("viewer-prev").disabled=currentPhotoIdx===0;
  document.getElementById("viewer-next").disabled=currentPhotoIdx===currentAlbum.photos.length-1;
  document.getElementById("viewer-dots").innerHTML=currentAlbum.photos.map((_,i)=>`
    <div onclick="viewerGoto(${i})" style="width:${i===currentPhotoIdx?18:6}px;height:6px;border-radius:3px;background:${i===currentPhotoIdx?"#C9A84C":"rgba(255,255,255,.2)"};cursor:pointer;transition:all .2s"></div>`).join("");
}
function viewerPrev(){if(currentPhotoIdx>0){currentPhotoIdx--;updateViewer();}}
function viewerNext(){if(currentAlbum&&currentPhotoIdx<currentAlbum.photos.length-1){currentPhotoIdx++;updateViewer();}}
function viewerGoto(i){currentPhotoIdx=i;updateViewer();}
